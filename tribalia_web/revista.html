<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revista Tribalia | Lector Interactivo</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logos/tribalia-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=1.5">
  <style>
    .reader-shell {
      background: #071b3a;
      min-height: calc(100vh - 78px);
      padding: 28px 0 48px;
      color: #FFFFFF;
    }
    .reader-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 14px 20px;
      margin-bottom: 24px;
    }
    .reader-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 560px;
      width: 100%;
    }
    #flipbookContainer {
      width: 100%;
      max-width: 940px;
      margin: 0 auto;
    }
    .flip-book {
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .mag-page {
      background: #FFFFFF;
      color: #1E293B;
      padding: 34px 30px;
      overflow-y: auto;
      border: 1px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 0.92rem;
      line-height: 1.65;
    }
    .mag-page--cover {
      background: linear-gradient(135deg, #0B2853 0%, #0A5B75 55%, #00A8E8 100%);
      color: #FFFFFF;
      text-align: center;
      justify-content: center;
      align-items: center;
      gap: 18px;
    }
    .mag-page--cover h1,
    .mag-page--cover h2 {
      color: #FFFFFF;
    }
    .mag-page-footer {
      border-top: 1px solid #E2E8F0;
      padding-top: 8px;
      margin-top: 14px;
      font-size: 0.75rem;
      color: #64748B;
      display: flex;
      justify-content: space-between;
    }
    .reader-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 22px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand-logo" aria-label="Tribalia Inicio">
        <img src="assets/img/logos/tribalia-logo.svg" alt="Tribalia" style="height:64px;width:auto;">
      </a>
      <div class="nav-actions">
        <a href="index.html#revista" class="btn btn-outline" id="readerBackBtn">← Volver a Revista</a>
        <a href="#" id="readerPdfBtn" class="btn btn-primary" style="display:none;" download>Descargar PDF ↓</a>
      </div>
    </div>
  </header>

  <main class="reader-shell">
    <div class="container">
      <div class="reader-toolbar">
        <div>
          <span style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:#00A8E8;font-weight:700;">Revista Tribalia</span>
          <h1 id="readerTitle" style="color:#FFFFFF;font-size:1.25rem;margin-top:2px;">Visor Interactivo</h1>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <span id="pageIndicator" style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.9rem;">Página 1</span>
        </div>
      </div>

      <div class="reader-stage">
        <div id="flipbookContainer"></div>
      </div>

      <div class="reader-controls">
        <button type="button" class="btn btn-glass" id="bookPrevBtn">‹ Página anterior</button>
        <button type="button" class="btn btn-light" id="bookNextBtn">Página siguiente ›</button>
      </div>
    </div>
  </main>

  <!-- Librerías ligeras para lectura EPUB y animación realista de cambio de página -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <script>
    (function () {
      let pageFlip = null;
      const params = new URLSearchParams(window.location.search);
      const magId = params.get('id');

      function updateCounter() {
        const ind = document.getElementById('pageIndicator');
        if (!pageFlip || !ind) return;
        const curr = pageFlip.getCurrentPageIndex() + 1;
        const total = pageFlip.getPageCount();
        ind.textContent = `Página ${curr} de ${total}`;
      }

      function mountFlipbook(pagesHtml) {
        const host = document.getElementById('flipbookContainer');
        if (!host) return;
        if (pageFlip) {
          pageFlip.destroy();
          pageFlip = null;
        }
        host.innerHTML = `<div id="tribaliaBook" class="flip-book">${pagesHtml.join('')}</div>`;
        const bookEl = document.getElementById('tribaliaBook');

        pageFlip = new St.PageFlip(bookEl, {
          width: 420,
          height: 560,
          size: 'stretch',
          minWidth: 260,
          maxWidth: 470,
          minHeight: 360,
          maxHeight: 620,
          showCover: true,
          usePortrait: window.innerWidth < 640,
          maxShadowOpacity: 0.45,
          mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll('#tribaliaBook .mag-page'));
        pageFlip.on('flip', updateCounter);
        updateCounter();
      }

      async function loadEpubBuffer(arrayBuffer, title) {
        const zip = await JSZip.loadAsync(arrayBuffer);
        const containerXml = await zip.file('META-INF/container.xml').async('string');
        const parser = new DOMParser();
        const containerDoc = parser.parseFromString(containerXml, 'application/xml');
        const opfPath = containerDoc.querySelector('rootfile').getAttribute('full-path');
        const opfDir = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : '';
        const opfXml = await zip.file(opfPath).async('string');
        const opfDoc = parser.parseFromString(opfXml, 'application/xml');

        const manifest = {};
        opfDoc.querySelectorAll('manifest > item').forEach((item) => {
          manifest[item.getAttribute('id')] = item.getAttribute('href');
        });

        const spineIds = Array.from(opfDoc.querySelectorAll('spine > itemref')).map((r) =>
          r.getAttribute('idref')
        );

        const pages = [
          `<div class="mag-page mag-page--cover" data-density="hard">
            <img src="assets/img/logos/tribalia-logo-blanco.svg" alt="Tribalia" style="height:64px;width:auto;">
            <h1 style="font-size:1.7rem;">${title || 'Revista Tribalia'}</h1>
            <p style="opacity:0.85;">Edición Digital Interactiva · Tribalia S.A.S.</p>
          </div>`
        ];

        let pageNum = 1;
        for (const id of spineIds) {
          const href = manifest[id];
          if (!href) continue;
          const fileObj = zip.file(opfDir + decodeURIComponent(href));
          if (!fileObj) continue;
          const xhtml = await fileObj.async('string');
          const doc = parser.parseFromString(xhtml, 'text/html');
          const bodyHtml = doc.body ? doc.body.innerHTML.trim() : '';
          if (!bodyHtml) continue;

          pages.push(`
            <div class="mag-page">
              <div class="mag-page-content">${bodyHtml}</div>
              <div class="mag-page-footer">
                <span>Revista Tribalia</span>
                <span>${pageNum++}</span>
              </div>
            </div>
          `);
        }

        if (pages.length % 2 !== 0) {
          pages.push(`
            <div class="mag-page mag-page--cover" data-density="hard">
              <img src="assets/img/logos/tribalia-logo-blanco.svg" alt="Tribalia" style="height:56px;width:auto;">
              <p style="opacity:0.85;">www.tribalia.com.co</p>
            </div>
          `);
        }

        mountFlipbook(pages);
      }

      async function init() {
        document.getElementById('bookPrevBtn').addEventListener('click', () => pageFlip && pageFlip.flipPrev());
        document.getElementById('bookNextBtn').addEventListener('click', () => pageFlip && pageFlip.flipNext());

        document.addEventListener('keydown', (e) => {
          if (!pageFlip) return;
          if (e.key === 'ArrowRight') pageFlip.flipNext();
          if (e.key === 'ArrowLeft') pageFlip.flipPrev();
        });

        try {
          const res = await fetch('data/editorial.json');
          const data = await res.json();
          const mag = (data.magazines || []).find((m) => String(m.id) === String(magId)) || (data.magazines || [])[0];
          if (mag) {
            document.getElementById('readerTitle').textContent = mag.title;
            if (mag.pdf_url) {
              const pdfBtn = document.getElementById('readerPdfBtn');
              pdfBtn.href = mag.pdf_url;
              pdfBtn.style.display = 'inline-flex';
            }
            if (mag.epub_url) {
              const epubRes = await fetch(mag.epub_url);
              const buf = await epubRes.arrayBuffer();
              await loadEpubBuffer(buf, mag.title);
              return;
            }
          }
        } catch (err) {
          // Sin ediciones publicadas todavía
        }

        // Vista inicial limpia del Flipbook mientras no haya un EPUB publicado
        mountFlipbook([
          `<div class="mag-page mag-page--cover" data-density="hard">
            <img src="assets/img/logos/tribalia-logo-blanco.svg" alt="Tribalia" style="height:64px;width:auto;">
            <h1 style="font-size:1.65rem;">Revista Tribalia</h1>
            <p style="opacity:0.88;">Visor interactivo tipo libro físico listo para tus archivos .EPUB</p>
          </div>`,
          `<div class="mag-page">
            <div>
              <h2 style="margin-bottom:12px;">Cómo visualizar una edición</h2>
              <p>Cuando subas tus revistas en formato <strong>.EPUB</strong> y <strong>.PDF</strong> desde el panel administrativo en Hostinger, cada edición aparecerá automáticamente en la página principal y se abrirá aquí con animación de paso de página.</p>
            </div>
            <div class="mag-page-footer"><span>Revista Tribalia</span><span>1</span></div>
          </div>`,
          `<div class="mag-page">
            <div>
              <h2 style="margin-bottom:12px;">Descarga directa en PDF</h2>
              <p>Junto al visor interactivo, los lectores contarán con un botón superior de <strong>Descargar PDF</strong> para guardar la revista completa en su dispositivo.</p>
            </div>
            <div class="mag-page-footer"><span>Revista Tribalia</span><span>2</span></div>
          </div>`,
          `<div class="mag-page mag-page--cover" data-density="hard">
            <img src="assets/img/logos/tribalia-logo-blanco.svg" alt="Tribalia" style="height:56px;width:auto;">
            <p style="opacity:0.85;">www.tribalia.com.co</p>
          </div>`
        ]);
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
